<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t d">
<title id="t">What the public sources we could read on 13 November 2026 say about six robot configurations, field by field</title>
<desc id="d">A grid of six rows and seven columns. The rows are configurations: Foundation's Phantom humanoid in a proposed Gaza use; Phantom's design and stated aims; Phantom MK-1's logistics demonstration in Ukraine; an armed non-humanoid comparison robot; the Singapore police patrol robot at Changi Airport from 2023; and the GIBSON ride-on robot on trial there since July 2025. The columns are: armed, AI's role, target choice (who picks targets), force decision (who allows force), human takeover (how a person steps in), stage reached, and effects on people. The middle three columns are marked as control. The Gaza row and the comparison row are entirely unreadable: the Gaza report is refused to our agents by robots.txt and the comparison's official page returned HTTP 403. Supported by a source: Phantom's design aim to carry weapons; the stage reached in all four readable rows; GIBSON's manual takeover of movement; and GIBSON's reported encounters with the public. One entry conflicts: two reported statements of Phantom's intentions on autonomy in combat decisions. Every other entry in the readable rows is not established by any source read: whether any of these robots is armed in the field, any role for AI, who picks targets, who allows force in practice, and any harm. Three squares are split in two: design aim against fielded weapon, stated intention against practice, and reported encounters against harm. 45 entries in all: 7 supported, 23 not established, 14 unreadable, 1 conflicting. The entries are Lighthouse's codings of what sources say, not counts of robots, weapons or events.</desc>
