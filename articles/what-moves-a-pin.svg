<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 688" width="720" height="688" role="img" aria-labelledby="t d">
<title id="t">Which mcp each published image installed around the 1.28.0 release, by how it installs, 14 May to 31 July 2026</title>
<desc id="d">Eleven rows, one for each image repository of software that depends on the Python library mcp, with published images built between 14 May and 31 July 2026 whose installed mcp was read. Each tick is one image at its build time, orange if it installed a version older than 1.28.0 and blue if it installed 1.28.0 or 1.28.1. A diamond marks the project's first commit naming 1.28.0 or later. mcp 1.28.0 was released on 16 June; a security advisory fixed in 1.28.1 was published on 16 July. The top four rows are images that resolve an open version range: three of them turn blue from 19 June, 29 June and 8 July, before their projects' own diamonds, and chemgraph's stay at 1.16.0. The lower seven are images built from a lockfile or an exact pin: better-telegram-mcp's turn blue on 18 June, just after its bot moved the lockfile; mcp-atlassian, seclab-taskflow-agent, openroad-mcp and serena have their diamonds within 28 hours after the advisory, and their images, where one was read afterwards, are blue only after it; browser-use and hybrid-groups have no diamond by 15 August and their images stay orange. Registries and git read on 26 September 2026.</desc>
