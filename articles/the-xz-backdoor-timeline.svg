<svg xmlns="http://www.w3.org/2000/svg" width="800" height="316" viewBox="0 0 800 316" role="img" aria-labelledby="t d">
  <title id="t">The xz backdoor, 24 February to 30 March 2024</title>
  <desc id="d">Three lanes. What was released: version 5.6.0 on 24 February and 5.6.1 on 9 March, the release that answered the valgrind errors; both public and unrecognised until late March. Where it was built in: Debian unstable from 26 February and testing from 5 March, rolled back on 28 March; Fedora took each release soon after it came out, dates estimated, and reverted on 29 March; openSUSE Tumbleweed also carried it, on dates the sources do not give. What people noticed: valgrind errors in Red Hat's distributions from 4 March, answered by Jia Tan's fixes of 8 and 9 March; Andres Freund's slow logins and valgrind errors, reported on 29 March.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f1f1f; }
    .lane { font-size: 13.5px; font-weight: 600; }
    .ev { font-size: 12px; }
    .note { font-size: 11.5px; font-style: italic; fill: #4a4a4a; }
    .axis { font-size: 11.5px; fill: #4a4a4a; }
    .solid { fill: #1f4e5f; stroke: #1f4e5f; stroke-width: 2; }
    .hollow { fill: #faf8f3; stroke: #1f4e5f; stroke-width: 2; }
    .grid { stroke: #e8e3d7; stroke-width: 1; }
    .sep { stroke: #d6d0c2; stroke-width: 1; }
    .link { stroke: #1f4e5f; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
  </style>
  <rect x="0" y="0" width="800" height="316" fill="#faf8f3"/>

  <!-- weekly gridlines; x = 165 + 17.5 per day from 24 February 2024 (a leap year) -->
  <line class="grid" x1="165" y1="16" x2="165" y2="258"/>
  <line class="grid" x1="270" y1="16" x2="270" y2="258"/>
  <line class="grid" x1="392.5" y1="16" x2="392.5" y2="258"/>
  <line class="grid" x1="515" y1="16" x2="515" y2="258"/>
  <line class="grid" x1="637.5" y1="16" x2="637.5" y2="258"/>
  <line class="grid" x1="760" y1="16" x2="760" y2="258"/>

  <!-- lane separators -->
  <line class="sep" x1="12" y1="86" x2="788" y2="86"/>
  <line class="sep" x1="12" y1="192" x2="788" y2="192"/>

  <!-- lane labels -->
  <text class="lane" x="16" y="48">What was</text>
  <text class="lane" x="16" y="65">released</text>
  <text class="lane" x="16" y="132">Where it was</text>
  <text class="lane" x="16" y="149">built in</text>
  <text class="lane" x="16" y="220">What people</text>
  <text class="lane" x="16" y="237">noticed</text>

  <!-- lane 1: what was released -->
  <rect x="165" y="46" width="595" height="16" rx="3" fill="#e6dfcf"/>
  <text class="note" x="604" y="58" text-anchor="middle" style="fill:#3a3a3a">in public, unrecognised until late March</text>
  <circle class="solid" cx="165" cy="54" r="6.5"/>
  <circle class="solid" cx="410" cy="54" r="6.5"/>
  <text class="ev" x="158" y="34">5.6.0, 24 Feb</text>
  <text class="ev" x="410" y="34" text-anchor="middle">5.6.1, 9 Mar: the “fix” for the errors</text>

  <!-- the 5.6.1 release answers the valgrind errors: joined across the lanes -->
  <line class="link" x1="410" y1="61" x2="410" y2="221"/>

  <!-- lane 2: where it was built in; Debian row -->
  <rect class="solid" x="200" y="111" width="542.5" height="4" rx="2" stroke-width="0"/>
  <circle class="solid" cx="200" cy="113" r="6.5"/>
  <circle class="solid" cx="340" cy="113" r="6.5"/>
  <circle class="solid" cx="742.5" cy="113" r="6.5"/>
  <text class="ev" x="194" y="101">Debian unstable, 26 Feb</text>
  <text class="ev" x="340" y="131" text-anchor="middle">testing, 5 Mar</text>
  <text class="ev" x="750" y="101" text-anchor="end">Debian rolls back, 28 Mar</text>

  <!-- lane 2: Fedora row -->
  <circle class="hollow" cx="270" cy="158" r="6.5"/>
  <circle class="hollow" cx="445" cy="158" r="6.5"/>
  <circle class="solid" cx="760" cy="158" r="6.5"/>
  <text class="ev" x="282" y="162">Fedora takes 5.6.0</text>
  <text class="ev" x="457" y="162">Fedora takes 5.6.1</text>
  <text class="ev" x="748" y="162" text-anchor="end">Fedora reverts, 29 Mar</text>
  <text class="note" x="424" y="184">openSUSE Tumbleweed also carried it, undated</text>

  <!-- lane 3: what people noticed -->
  <rect class="solid" x="322.5" y="216" width="87.5" height="10" rx="5"/>
  <circle class="solid" cx="760" cy="221" r="6.5"/>
  <text class="ev" x="322.5" y="244">valgrind errors in Red Hat's distributions from 4 Mar,</text>
  <text class="ev" x="322.5" y="258">answered by Jia Tan's “fixes” of 8 and 9 Mar</text>
  <text class="ev" x="772" y="208" text-anchor="end">Freund: slow logins and valgrind errors, reported 29 Mar</text>

  <!-- axis -->
  <line class="sep" x1="165" y1="266" x2="777.5" y2="266"/>
  <text class="axis" x="16" y="283">2024</text>
  <text class="axis" x="165" y="283" text-anchor="middle">24 Feb</text>
  <text class="axis" x="270" y="283" text-anchor="middle">1 Mar</text>
  <text class="axis" x="392.5" y="283" text-anchor="middle">8 Mar</text>
  <text class="axis" x="515" y="283" text-anchor="middle">15 Mar</text>
  <text class="axis" x="637.5" y="283" text-anchor="middle">22 Mar</text>
  <text class="axis" x="760" y="283" text-anchor="middle">29 Mar</text>

  <!-- legend -->
  <circle class="solid" cx="171" cy="302" r="5"/>
  <text class="axis" x="182" y="306">dated in the sources</text>
  <circle class="hollow" cx="316" cy="302" r="5"/>
  <text class="axis" x="327" y="306">date estimated</text>
  <line class="link" x1="436" y1="302" x2="460" y2="302"/>
  <text class="axis" x="467" y="306">a release answering a complaint</text>
</svg>
