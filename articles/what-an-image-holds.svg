<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 484" width="720" height="484" role="img" aria-labelledby="t d">
<title id="t">Which mcp each published image installed, against what each project named, 19 March to 30 May 2026</title>
<desc id="d">One row for each of five projects. Each tick is one published image of the project, placed at the time it was built and coloured by the version of the library mcp installed inside it: orange for a version older than 1.27.0, blue for 1.27.0 or later. The line beneath is the version the project itself named, in its git lockfile or, for keboola and octobot, in its published package, and the diamond marks when that named version first became 1.27.0. mcp 1.27.0 was released on 2 April. agentcrew's images held 1.27.0 from 8 April, 16 days before its lockfile moved on 24 April. serena's images moved on 27 April, three days after its pin. keboola's moved on 17 April, three days before its package release requiring 1.27.0. mcp-snowflake-server's held 1.14.0 until 6 May and moved 11 minutes after its pin. octobot's held 1.26.0, and its next image, on 30 July, still did. A sixth project, jesse, is left out: the one image of it read held no mcp.</desc>
