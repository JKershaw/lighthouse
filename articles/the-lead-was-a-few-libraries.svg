<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
<title id="t">How fast pinned software moved to a security fix before its advisory, library by library, for fixes whose notes said so and for silent ones, thirty Python libraries, 2026</title>
<desc id="d">Dots in two rows on a horizontal scale spaced by multiples, from 0.5 to 200 moves per 100 waiting projects per day, with a separate column at the left for libraries with no move. Each dot is one library, its size the number of days its pinned projects spent waiting before the advisory. The upper row is the 18 libraries whose fix's notes said it mended a security flaw: four with no move (authlib, mistune, sqlparse and mako), then nltk at 0.58, the largest dot, with 691 repository-days, pyasn1 0.83, pyjwt 1.85, urllib3 1.92, setuptools 3.17, bleach 3.26, pillow 3.71, lxml 5.97, aiohttp 6.05, cryptography 9.31, tornado 10.19, gitpython 12.47, pypdf 35.58 and poetry 44.37. A solid line marks the median library at 3.2 and a dashed line the rate pooled over all their repositories at 2.3. The lower row is the 12 silent libraries: two with no move (anthropic and litellm), then python-dotenv 0.57, starlette 0.74, soupsieve 0.76, mcp 1.30, httplib2 4.18, joserfc 4.92, fastmcp 20.21, awscli 27.98, pip 67.42 and pydantic-ai-slim 190.21, the smallest dot, with half a repository-day. The median is 2.7 and the pooled rate 1.6. The big, slow dots sit at the left of both rows and the small, fast ones at the right of both. Shuffling the two labels over the 30 libraries gives a gap between the medians at least this large 89 times in 100. 209 pinned repository and library pairs on 30 libraries, one fix each, released 24 February to 13 August 2026, advisories 27 March to 17 August 2026, histories read to 27 September 2026.</desc>
