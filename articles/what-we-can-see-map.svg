<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Four windows on AI activity</title>
  <desc id="map-desc">Four windows on AI activity, drawn with soft edges that fade out: public code and packages, which counts public events and downloads; one broker's traffic, which counts tokens; one vendor's consumer chats, which gives shares of conversations; and one network's crawler traffic, which counts requests from identified AI crawlers. The edges are soft because none of the four says how much of all AI activity it sees, or where it overlaps the others. The space between and around the windows is marked unobserved, which is not the same as empty.</desc>
  <defs>
    <radialGradient id="g-code"><stop offset="0" stop-color="#a8cfb5" stop-opacity="0.95"/><stop offset="0.6" stop-color="#a8cfb5" stop-opacity="0.55"/><stop offset="1" stop-color="#a8cfb5" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-broker"><stop offset="0" stop-color="#bbbce6" stop-opacity="0.95"/><stop offset="0.6" stop-color="#bbbce6" stop-opacity="0.55"/><stop offset="1" stop-color="#bbbce6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-chats"><stop offset="0" stop-color="#e7c69c" stop-opacity="0.95"/><stop offset="0.6" stop-color="#e7c69c" stop-opacity="0.55"/><stop offset="1" stop-color="#e7c69c" stop-opacity="0"/></radialGradient>
    <radialGradient id="g-crawl"><stop offset="0" stop-color="#d7b5d0" stop-opacity="0.95"/><stop offset="0.6" stop-color="#d7b5d0" stop-opacity="0.55"/><stop offset="1" stop-color="#d7b5d0" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="400" fill="#fbfaf7"/>
  <ellipse cx="205" cy="150" rx="205" ry="92" fill="url(#g-code)"/>
  <ellipse cx="595" cy="150" rx="205" ry="92" fill="url(#g-broker)"/>
  <ellipse cx="205" cy="290" rx="205" ry="92" fill="url(#g-chats)"/>
  <ellipse cx="595" cy="290" rx="205" ry="92" fill="url(#g-crawl)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1d2530" text-anchor="middle">
    <text x="28" y="34" font-size="17" font-weight="600" text-anchor="start">Four windows on AI activity</text>

    <text x="205" y="146" font-size="15" font-weight="600">Public code and packages</text>
    <text x="205" y="166" font-size="13" fill="#34404c">counts public events and downloads</text>

    <text x="595" y="146" font-size="15" font-weight="600">One broker's traffic</text>
    <text x="595" y="166" font-size="13" fill="#34404c">counts tokens routed through it</text>

    <text x="205" y="286" font-size="15" font-weight="600">One vendor's consumer chats</text>
    <text x="205" y="306" font-size="13" fill="#34404c">gives shares of conversations</text>

    <text x="595" y="286" font-size="15" font-weight="600">One network's crawler traffic</text>
    <text x="595" y="306" font-size="13" fill="#34404c">counts requests from identified AI crawlers</text>

    <text x="400" y="225" font-size="14" font-style="italic" fill="#34404c">unobserved, which is not the same as empty</text>

    <text x="28" y="388" font-size="13" fill="#34404c" text-anchor="start">Edges are soft: none of the four says how much of all AI activity it sees, or where it overlaps the others.</text>
  </g>
</svg>
