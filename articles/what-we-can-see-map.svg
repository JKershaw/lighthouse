<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="map-title map-desc">
  <title id="map-title">Four windows on AI activity</title>
  <desc id="map-desc">A pale field stands for all the AI activity on the internet. Four small, separate patches sit in it, labelled public code forges, one broker's traffic, one vendor's consumer chats and one network's crawler traffic. No lines join them, and most of the field is empty. A note says the sizes and positions are illustrative and that nobody has measured where the windows overlap.</desc>
  <rect width="800" height="400" fill="#fbfaf7"/>
  <rect x="20" y="20" width="760" height="360" rx="18" fill="#eef2f5" stroke="#c3cdd6" stroke-width="1.5"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#1d2530" text-anchor="middle">
    <text x="44" y="52" font-size="16" font-weight="600" text-anchor="start">All the AI activity on the internet</text>

    <ellipse cx="160" cy="118" rx="58" ry="26" fill="#cfe2d5" stroke="#6f9a80" stroke-width="1.5"/>
    <text x="160" y="166" font-size="14" font-weight="600">Public code forges</text>
    <text x="160" y="184" font-size="12" fill="#3b4652">public events and downloads</text>

    <ellipse cx="610" cy="100" rx="58" ry="26" fill="#d9d9ee" stroke="#7d7fb0" stroke-width="1.5"/>
    <text x="610" y="148" font-size="14" font-weight="600">One broker's traffic</text>
    <text x="610" y="166" font-size="12" fill="#3b4652">requests routed through it</text>

    <ellipse cx="290" cy="262" rx="58" ry="26" fill="#efdcc5" stroke="#b08a5c" stroke-width="1.5"/>
    <text x="290" y="310" font-size="14" font-weight="600">One vendor's consumer chats</text>
    <text x="290" y="328" font-size="12" fill="#3b4652">personal plans, first report</text>

    <ellipse cx="620" cy="250" rx="58" ry="26" fill="#e5d3e1" stroke="#9a6f92" stroke-width="1.5"/>
    <text x="620" y="298" font-size="14" font-weight="600">One network's crawler traffic</text>
    <text x="620" y="316" font-size="12" fill="#3b4652">identified crawlers, opted-in sites</text>

    <text x="420" y="212" font-size="13" font-style="italic" fill="#3b4652">unobserved, which is not the same as empty</text>

    <text x="44" y="362" font-size="12" fill="#3b4652" text-anchor="start">Sizes and positions are illustrative. Nobody has measured where these windows overlap.</text>
  </g>
</svg>
