<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 556" width="600" height="556" role="img" aria-labelledby="t d">
<title id="t">How much of each day's downloads of mcp were the new version, 26 March to 22 April 2026</title>
<desc id="d">A bar for each day from 26 March to 22 April 2026 shows the share of that day's downloads of the Python library mcp that were its new version, 1.27.0, published on 2 April at 14:48 UTC. The share is 22 per cent on the day of release, 48 per cent the next day, 51 per cent the day after, and between 45 and 71 per cent on every day to 22 April. Beneath, the days on which four of nine neighbouring projects that depend on the library were seen taking it up: 4, 8, 13, 14 and 22 April. The downloads reach about half before the first of those days.</desc>
<style>
svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6e69; --grid:#e4e3df; --bar:#2a78d6; --acc:#0b0b0b; }
@media (prefers-color-scheme: dark) { svg { --bg:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#9a9890; --grid:#383835; --bar:#3987e5; --acc:#ffffff; } }
text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--ink); }
.head { font-size: 17px; font-weight: 600; } .sub { font-size: 13px; fill: var(--ink2); }
.ax { font-size: 12px; fill: var(--muted); } .lab { font-size: 13px; fill: var(--ink2); }
.strong { font-size: 13px; font-weight: 600; } .note { font-size: 12px; fill: var(--muted); }
</style>
<rect width="600" height="556" fill="var(--bg)"/>
<text class="head" x="16" y="30">The new version, as a share of each day's downloads</text>
