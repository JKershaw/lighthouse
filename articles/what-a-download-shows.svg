<text class="ax" x="44" y="268.5" text-anchor="end">25%</text>
<line x1="52" y1="211.0" x2="580" y2="211.0" stroke="var(--grid)" stroke-width="1"/>
<text class="ax" x="44" y="215.0" text-anchor="end">50%</text>
<line x1="52" y1="157.5" x2="580" y2="157.5" stroke="var(--grid)" stroke-width="1"/>
<text class="ax" x="44" y="161.5" text-anchor="end">75%</text>
<line x1="52" y1="104.0" x2="580" y2="104.0" stroke="var(--grid)" stroke-width="1"/>
<text class="ax" x="44" y="108.0" text-anchor="end">100%</text>
