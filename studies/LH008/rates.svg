<path d="M376.0,536 V529.1 q0,-4 4,-4 H871.0 q4,0 4,4 V536 Z" fill="var(--s3)"><title>release +7 to +30 days: 11 moves in 1729.9 repository-days, 0.64 per 100</title></path>
<text x="625.5" y="519.1" font-size="12" text-anchor="middle">0.6</text>
