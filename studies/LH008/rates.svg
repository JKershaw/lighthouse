<path d="M223.5,536 V491.9 q0,-4 4,-4 H261.1 q4,0 4,4 V536 Z" fill="var(--s3)"><title>release +0 to +2 days: 5 moves in 176.6 repository-days, 2.83 per 100</title></path>
<text x="244.3" y="481.9" font-size="12" text-anchor="middle">2.8</text>
