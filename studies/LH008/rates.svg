<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 648" width="900" height="648" role="img" aria-labelledby="t d">
<title id="t">How fast pins moved after a fixed release, after its advisory, and after a release no advisory named</title>
<desc id="d">Moves per 100 repository-days at risk, by window. In the two days after the fixed release the rate was 4.1, from day two to day seven, or to the advisory where it came first, 1.5; in the two days after the advisory 5.1 and in days two to seven after it 4.3, against 1.3 to 1.7 in the weeks between and after; after a comparison release no advisory named, 2.8 in the first two days and 0.6 from day seven to thirty. The values are in data/hazard.csv.</desc>
<style>
svg { --bg:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e4e3df; --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
@media (prefers-color-scheme: dark) { svg { --bg:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781; --grid:#383835; --s1:#3987e5; --s2:#d95926; --s3:#199e70; } }
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
.t2 { fill: var(--ink2); } .mu { fill: var(--muted); }
</style>
<rect width="900" height="648" fill="var(--bg)"/>
<text x="16" y="28" font-size="17" font-weight="600">Pins moved faster after a fix and its advisory than after a release no advisory named</text>
<text x="16" y="50" font-size="13" class="t2">Moves per 100 repository-days at risk, by window, in days from each reference time. Four libraries; pooled.</text>
<text x="70" y="86" font-size="13" font-weight="600">From the fixed release (fix frames, 102 repositories)</text>
<line x1="70" y1="204.0" x2="876" y2="204.0" stroke="var(--grid)" stroke-width="1"/>
<text x="62" y="208.0" font-size="11" text-anchor="end" class="t2">0</text>
<line x1="70" y1="170.0" x2="876" y2="170.0" stroke="var(--grid)" stroke-width="1"/>
<text x="62" y="174.0" font-size="11" text-anchor="end" class="t2">2</text>
<line x1="70" y1="136.0" x2="876" y2="136.0" stroke="var(--grid)" stroke-width="1"/>
<text x="62" y="140.0" font-size="11" text-anchor="end" class="t2">4</text>
<line x1="70" y1="102.0" x2="876" y2="102.0" stroke="var(--grid)" stroke-width="1"/>
<text x="62" y="106.0" font-size="11" text-anchor="end" class="t2">6</text>
<line x1="222.5" y1="92" x2="222.5" y2="204" stroke="var(--ink)" stroke-width="1.5"/>
<path d="M223.5,204 V138.1 q0,-4 4,-4 H261.1 q4,0 4,4 V204 Z" fill="var(--s1)"><title>release +0 to +2 days (before every advisory): 8 moves in 194.4 repository-days, 4.11 per 100</title></path>
<text x="244.3" y="128.1" font-size="12" text-anchor="middle">4.1</text>
<path d="M267.1,204 V182.3 q0,-4 4,-4 H370.0 q4,0 4,4 V204 Z" fill="var(--s1)"><title>release +2 to +7 days, or to the advisory where it came first (urllib3 +3.9, cryptography +5.9): 5 moves in 330.1 repository-days, 1.51 per 100</title></path>
<text x="320.5" y="172.3" font-size="12" text-anchor="middle">1.5</text>
<path d="M376.0,204 V185.2 q0,-4 4,-4 H740.3 q4,0 4,4 V204 Z" fill="var(--s1)"><title>release +7 days to the advisory (pyjwt and starlette, whose advisories came 25 and 23 days after): 6 moves in 449.3 repository-days, 1.34 per 100</title></path>
<text x="560.1" y="175.2" font-size="12" text-anchor="middle">1.3</text>
<text x="70.0" y="219" font-size="11" text-anchor="middle" class="t2">-7</text>
<text x="222.5" y="219" font-size="11" text-anchor="middle" class="t2">+0</text>
<text x="266.1" y="219" font-size="11" text-anchor="middle" class="t2">+2</text>
<text x="375.0" y="219" font-size="11" text-anchor="middle" class="t2">+7</text>
<text x="527.5" y="219" font-size="11" text-anchor="middle" class="t2">+14</text>
<text x="679.9" y="219" font-size="11" text-anchor="middle" class="t2">+21</text>
<text x="876.0" y="219" font-size="11" text-anchor="middle" class="t2">+30</text>
<text x="876" y="114" font-size="11" text-anchor="end" class="mu">+2 to +7 stops at the advisory where it came first (urllib3 +3.9, cryptography +5.9); from +7 to the advisory: pyjwt and starlette only</text>
<text x="70" y="252" font-size="13" font-weight="600">From the advisory (the same 102 repositories)</text>
