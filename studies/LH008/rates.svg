<path d="M71.0,370 V341.0 q0,-4 4,-4 H217.5 q4,0 4,4 V370 Z" fill="var(--s2)"><title>advisory -7 to +0 days, from the release at the earliest (includes release days for urllib3 and cryptography): 9 moves in 464.3 repository-days, 1.94 per 100</title></path>
<text x="146.2" y="331.0" font-size="12" text-anchor="middle">1.9</text>
<path d="M223.5,370 V287.3 q0,-4 4,-4 H261.1 q4,0 4,4 V370 Z" fill="var(--s2)"><title>advisory +0 to +2 days: 8 moves in 156.8 repository-days, 5.1 per 100</title></path>
<text x="244.3" y="277.3" font-size="12" text-anchor="middle">5.1</text>
<path d="M267.1,370 V301.4 q0,-4 4,-4 H370.0 q4,0 4,4 V370 Z" fill="var(--s2)"><title>advisory +2 to +7 days: 14 moves in 328.1 repository-days, 4.27 per 100</title></path>
<text x="320.5" y="291.4" font-size="12" text-anchor="middle">4.3</text>
<path d="M376.0,370 V345.8 q0,-4 4,-4 H871.0 q4,0 4,4 V370 Z" fill="var(--s2)"><title>advisory +7 to +30 days: 19 moves in 1141.8 repository-days, 1.66 per 100</title></path>
<text x="625.5" y="335.8" font-size="12" text-anchor="middle">1.7</text>
<text x="70.0" y="385" font-size="11" text-anchor="middle" class="t2">-7</text>
<text x="222.5" y="385" font-size="11" text-anchor="middle" class="t2">+0</text>
<text x="266.1" y="385" font-size="11" text-anchor="middle" class="t2">+2</text>
<text x="375.0" y="385" font-size="11" text-anchor="middle" class="t2">+7</text>
<text x="527.5" y="385" font-size="11" text-anchor="middle" class="t2">+14</text>
<text x="679.9" y="385" font-size="11" text-anchor="middle" class="t2">+21</text>
