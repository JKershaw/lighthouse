<text x="16" y="604" font-size="11" class="mu">Repositories of Open Source Insights dependents of urllib3, cryptography, pyjwt and starlette that pinned or locked the release</text>
<text x="16" y="620" font-size="11" class="mu">before; a move is the first default-branch commit taking the pin to the fix (or comparison release) or later. Git, PyPI and OSV</text>
<text x="16" y="636" font-size="11" class="mu">read 27 September 2026. Source: Lighthouse LH008, data/hazard.csv.</text>
</svg>
