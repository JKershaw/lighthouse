<text x="62" y="340.0" font-size="11" text-anchor="end" class="t2">2</text>
<line x1="70" y1="302.0" x2="876" y2="302.0" stroke="var(--grid)" stroke-width="1"/>
<text x="62" y="306.0" font-size="11" text-anchor="end" class="t2">4</text>
<line x1="70" y1="268.0" x2="876" y2="268.0" stroke="var(--grid)" stroke-width="1"/>
<text x="62" y="272.0" font-size="11" text-anchor="end" class="t2">6</text>
