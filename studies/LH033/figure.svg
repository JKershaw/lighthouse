<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-labelledby="t d">
<title id="t">The PHP emergency fix by Censys's count of internet-facing services, beside how Python security fixes reached downloads, to 27 October 2026</title>
<desc id="d">Two charts. The first is a line chart: the horizontal axis is days since release, 0 to 30; the vertical axis is a share from 0 to 100 per cent, with a dashed line at half. Four teal lines with different dash patterns, one per PHP branch, show the share of version-reporting internet-facing PHP services in that branch that Censys counts as patched, by day since PHP's release on 21 October 2026. They start near 2 to 4 per cent on day 0, climb steeply on days 1 and 2 and stop at day 6, the last completed day read: 8.5 77.5%, 8.4 66.0%, 8.2 51.2%, 8.3 50.6%. An amber band shows the range of four Python security fixes' share of their library's daily downloads, from 54% to 61% on day 1 and 57% to 72% on day 30, nearly flat; a dashed amber line shows the median over 37 Python libraries, 58% on day 1 and 62% on day 30. The two measure different things: services as last scanned, and downloads in a day. The second chart is one bar splitting the 44.1 million PHP services that reported a version on 27 October: 11.5 million patched, 8.5 million in fixed branches not yet counted patched, and 24.1 million on branches PHP did not fix. A further 62.0 million reported no version. Sources: Censys ARC's PHP2Shell dashboard, read by Lighthouse; ClickPy's copy of the Python Package Index download log, read 28 September 2026.</desc>
