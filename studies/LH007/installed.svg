<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" role="img" aria-labelledby="t d">
<title id="t">Which images held mcp 1.28 in the weeks around its release, by how they install</title>
<desc id="d">One row per image repository in the LH007 sample with an installed mcp read. Images that resolve an open range held the new release from 2.6 days after it; images built from a lockfile or exact pin held it only after the project moved the pin, which for six projects came within 28 hours after a security advisory on 16 July.</desc>
