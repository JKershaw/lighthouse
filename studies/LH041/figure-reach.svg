<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 790" width="720" height="790" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Maintainer clusters reached after each wave&#x27;s first malicious publish</title>
<desc id="chart-desc">Six small step charts, one per worm wave. Each shows how many separate groups of npm maintainer accounts had published a malicious version, counting up from the wave&#x27;s first publish by the registry&#x27;s clock. Shai-Hulud 2.0 reached 88 clusters in under 15 hours; ChainDrop 13 of its 14 in under 4 hours; Shai-Hulud 17 in 71 hours; the TanStack wave 13 in 30 hours; Miasma 8 in 87 hours; the AntV wave stayed mostly in one cluster of 316 packages, with 2 others. Post hoc view, unreviewed. Source: OSV malicious-package records and npm registry metadata read 8 November 2026.</desc>
<style>
svg { --bg:#fbfaf7; --ink:#1f1f1f; --muted:#5d5850; --grid:#e3ddd1; --teal:#1f6576; --amber:#93600c; --purple:#78549b; --blue:#2866ab; --neutral:#74716a; color-scheme:light dark; }
@media (prefers-color-scheme: dark) { svg { --bg:#15191b; --ink:#e6e2d9; --muted:#aaa498; --grid:#2f3538; --teal:#8ec4d4; --amber:#e0a650; --purple:#c6a7df; --blue:#8bb9ed; --neutral:#aaa498; } }
text { font-family:"Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric:tabular-nums lining-nums; fill:var(--ink); }
.head { font-size:17px; font-weight:600; }
.sub { font-size:13px; fill:var(--muted); }
.ann,.ax { font-size:12px; fill:var(--muted); }
.nm { font-size:12px; font-weight:600; }
.note { font-size:11.5px; fill:var(--muted); }
.sec { font-size:14px; font-weight:600; }
.grid { stroke:var(--grid); stroke-width:1; }
.axis { stroke:var(--muted); stroke-width:1; }
</style>
