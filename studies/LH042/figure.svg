<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" width="720" height="650" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Published counts of exposed AI services, by method</title>
<desc id="chart-desc">Four small charts, each its own series and axis, never joined. OpenA2A&#x27;s monthly Shodan index, March to November 2026: OpenClaw-family gateways 242,379 on 14 March, 267,172 on 11 April, lowest 153,638 on 26 June, 205,872 on 1 November; LLM endpoints between 5,126 and 47,369; MCP servers rising from 889 to 2,734. Xu and co-authors&#x27; own daily sweep of Ollama&#x27;s port: 10,473 IPs on 14 February 2025, 16,821 on 25 April 2025, about 11,500 in July 2025 and 16,059 on 13 February 2026. A Shodan index count is what Shodan&#x27;s crawlers indexed, not a verified host. Source: LH042 data/counts.csv.</desc>
<style>
svg { --bg:#fbfaf7; --ink:#1f1f1f; --muted:#5d5850; --grid:#e3ddd1; --teal:#1f6576; --amber:#93600c; --purple:#78549b; --blue:#2866ab; --neutral:#74716a; color-scheme:light dark; }
@media (prefers-color-scheme: dark) { svg { --bg:#15191b; --ink:#e6e2d9; --muted:#aaa498; --grid:#2f3538; --teal:#8ec4d4; --amber:#e0a650; --purple:#c6a7df; --blue:#8bb9ed; --neutral:#aaa498; } }
text { font-family:"Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric:tabular-nums lining-nums; fill:var(--ink); }
.head { font-size:17px; font-weight:600; }
.sub { font-size:13px; fill:var(--muted); }
.ann,.ax { font-size:12px; fill:var(--muted); }
.nm { font-size:12px; font-weight:600; }
.note { font-size:11.5px; fill:var(--muted); }
.sec { font-size:14px; font-weight:600; }
.grid { stroke:var(--grid); stroke-width:1; }
.axis { stroke:var(--muted); stroke-width:1; }
</style>
