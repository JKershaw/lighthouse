<text class="sub" x="16" y="48">Events in each file read at 00, 06, 12 and 18 UTC, 1 September to 7 November 2026 (272 files).</text>
<text class="sub" x="16" y="66">No PushEvent in 26 of 176 files before 15 October and 64 of 96 from 15 October.</text>
