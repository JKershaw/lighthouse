<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">GH Archive hourly files: events and pushes per file, 1 September to 7 November 2026</title>
<desc id="chart-desc">Line chart of the number of events in each of 272 GH Archive hourly files read at 00, 06, 12 and 18 UTC each day from 1 September to 7 November 2026, with a second line for PushEvents. 90 files held no PushEvent; they are marked as ticks in a strip below the chart. The median of 16 reference files from January to August 2026 (hour 12) was 158,693 events and 124,358 PushEvents. Counts are what the files held when read on 8 November 2026; they are not GitHub&#x27;s own activity.</desc>
<style>
