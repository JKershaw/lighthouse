<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 478" width="360" height="478" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">How a claim changed after review</title>
<desc id="chart-desc">Four directly linked records. The earlier essay cites METR’s tentative account, shown by a dotted arrow pointing upwards. A later review challenges the earlier essay, and the corrected claim revises it, with solid arrows pointing back to the earlier wording. These are evidence relationships, not a causal or time scale.</desc>
