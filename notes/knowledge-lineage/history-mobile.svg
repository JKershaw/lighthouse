<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1210" width="360" height="1210" role="img" aria-labelledby="history-phone-title history-phone-desc">
<title id="history-phone-title">How the software-update inquiry developed</title>
<desc id="history-phone-desc">Eight selected readings. Projects led to downloads and images, then an advisory hypothesis. Wider samples revised that explanation and left the release-note question unsettled. A branch from downloads tested the two-day pattern in more libraries. Each box links to the current article; the HTML list supplies summaries and evidence. Arrows follow documented steps, not measured causes.</desc>
<style>
svg { --bg:#fbfaf7; --ink:#1f1f1f; --muted:#5d5850; --grid:#e3ddd1; --teal:#1f6576; --amber:#93600c; --purple:#78549b; --blue:#2866ab; --neutral:#74716a; color-scheme:light dark; }
@media (prefers-color-scheme: dark) { svg { --bg:#15191b; --ink:#e6e2d9; --muted:#aaa498; --grid:#2f3538; --teal:#8ec4d4; --amber:#e0a650; --purple:#c6a7df; --blue:#8bb9ed; --neutral:#aaa498; } }
text { font-family:"Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-variant-numeric:tabular-nums lining-nums; fill:var(--ink); }
.head { font-size:17px; font-weight:600; }
.sub { font-size:13px; fill:var(--muted); }
.ann,.ax { font-size:12px; fill:var(--muted); }
