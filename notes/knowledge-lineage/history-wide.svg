<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 610" width="1040" height="610" role="img" aria-labelledby="history-wide-title history-wide-desc">
<title id="history-wide-title">How the software-update inquiry developed</title>
<desc id="history-wide-desc">Eight selected readings. Projects led to downloads and images, then an advisory hypothesis. Wider samples revised that explanation and left the release-note question unsettled. A branch from downloads tested the two-day pattern in more libraries. Each box links to the current article; the HTML list supplies summaries and evidence. Arrows follow documented steps, not measured causes.</desc>
