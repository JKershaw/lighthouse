# Builds the Lighthouse site from the repository's Markdown and publishes it
# to GitHub Pages on every push to main. See site/README.md.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so that each page's last-changed date comes from git.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate readiness
        run: |
          python3 -m unittest discover -s schedule -p 'test_*.py'
          python3 schedule/check.py
      - name: Summarise recorded costs
        continue-on-error: true
        run: python3 schedule/cost_summary.py
      - id: pages
        uses: actions/configure-pages@v6
      - name: Install
        working-directory: site
        run: npm ci
      # The site's unit and template tests. A failure stops the deploy, so the
      # live site keeps its last good build. The page budget test skips itself
      # here because nothing is built yet; it runs after the build, below.
      - name: Test
        working-directory: site
        run: npm test
      - name: Build
        working-directory: site
        env:
          # "/" with a custom domain; "/<repository>/" on a github.io address.
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
        run: npm run build
      # Word and link budgets for the built front page. Reported, not
      # blocking: a page a few words over should not hold back a correction.
      - name: Page budgets (reported, not blocking)
        working-directory: site
        continue-on-error: true
        run: node --test test/budgets.test.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
