<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 620" role="img" aria-labelledby="title desc"><title id="title">What a handover can carry</title><desc id="desc">A proposed handover loop: an agent acts, writes a record of progress, a successor reads it as context and acts again. The highlighted reading step asks whether a description is being treated as permission; a dashed arrow marks another handover. This is a research hypothesis, not a measured causal chain.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#657785" stroke-width="1.5"/></marker></defs><rect width="480" height="620" rx="20" fill="#f1f3ef"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="30" y="39" font-size="14" font-weight="750" fill="#9b532a">A HYPOTHESIS TO TEST</text><text x="30" y="74" font-size="26" font-weight="650" fill="#203341">What a handover can carry</text><rect x="65" y="99" width="385" height="88" rx="13" fill="#fff" stroke="#ccd3cf" stroke-width="1.5"/><text x="84" y="133" font-size="23" font-weight="650" fill="#203341">An agent acts</text><text x="84" y="162" font-size="17" font-weight="400" fill="#53616a">It has a task and permissions</text><path d="M257 190V211" stroke="#657785" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="215" width="385" height="88" rx="13" fill="#fff" stroke="#ccd3cf" stroke-width="1.5"/><text x="84" y="249" font-size="23" font-weight="650" fill="#203341">It writes a record</text><text x="84" y="278" font-size="17" font-weight="400" fill="#53616a">History, assumptions, next steps</text><path d="M257 306V327" stroke="#657785" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="331" width="385" height="88" rx="13" fill="#fff4e9" stroke="#bc7546" stroke-width="1.5"/><text x="84" y="365" font-size="23" font-weight="650" fill="#203341">A worker reads it</text><text x="84" y="394" font-size="17" font-weight="400" fill="#53616a">Evidence, example… or permission?</text><path d="M257 422V443" stroke="#657785" stroke-width="2" marker-end="url(#arrow)"/><rect x="65" y="447" width="385" height="88" rx="13" fill="#fff" stroke="#ccd3cf" stroke-width="1.5"/><text x="84" y="481" font-size="23" font-weight="650" fill="#203341">The worker acts</text><text x="84" y="510" font-size="17" font-weight="400" fill="#53616a">And leaves another record</text><path d="M65 490H33V259H62" fill="none" stroke="#9b532a" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="30" y="590" font-size="16" font-weight="400" fill="#53616a">A fresh agent or the same session’s next stretch.</text></g></svg>