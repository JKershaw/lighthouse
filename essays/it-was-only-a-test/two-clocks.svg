<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 650" role="img" aria-labelledby="title desc"><title id="title">Two organisations, different clocks</title><desc id="desc">Five dated points in two organisations' accounts: 11 to 13 July, the production compromise by OpenAI's reconstruction; 16 July, Hugging Face's disclosure; 19 July, OpenAI's internal alert; 20 July, the suspected connection and notification; 21 July, OpenAI's public disclosure.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#657785" stroke-width="1.5"/></marker></defs><rect width="480" height="650" rx="20" fill="#f1f3ef"/><g font-family="system-ui,-apple-system,Segoe UI,sans-serif"><text x="30" y="39" font-size="14" font-weight="650" fill="#53616a">TWO ORGANISATIONS, DIFFERENT CLOCKS</text><text x="30" y="74" font-size="28" font-weight="650" fill="#203341">July 2026</text><circle cx="39" cy="131" r="7" fill="#237b79"/><path d="M39 141V227" stroke="#c7cecb" stroke-width="2"/><text x="62" y="120" font-size="14" font-weight="750" fill="#237b79">11 to 13 JUL</text><text x="62" y="148" font-size="20" font-weight="650" fill="#203341">Production compromise</text><text x="62" y="173" font-size="16" font-weight="400" fill="#53616a">OpenAI’s later reconstruction</text><circle cx="39" cy="236" r="7" fill="#3855a2"/><path d="M39 246V332" stroke="#c7cecb" stroke-width="2"/><text x="62" y="225" font-size="14" font-weight="750" fill="#3855a2">16 JUL</text><text x="62" y="253" font-size="20" font-weight="650" fill="#203341">Hugging Face discloses</text><text x="62" y="278" font-size="16" font-weight="400" fill="#53616a">The model is still unknown</text><circle cx="39" cy="341" r="7" fill="#237b79"/><path d="M39 351V437" stroke="#c7cecb" stroke-width="2"/><text x="62" y="330" font-size="14" font-weight="750" fill="#237b79">19 JUL</text><text x="62" y="358" font-size="20" font-weight="650" fill="#203341">OpenAI’s internal alert</text><text x="62" y="383" font-size="16" font-weight="400" fill="#53616a">Suspicious activity is detected</text><circle cx="39" cy="446" r="7" fill="#237b79"/><path d="M39 456V542" stroke="#c7cecb" stroke-width="2"/><text x="62" y="435" font-size="14" font-weight="750" fill="#237b79">20 JUL</text><text x="62" y="463" font-size="20" font-weight="650" fill="#203341">OpenAI suspects a link</text><text x="62" y="488" font-size="16" font-weight="400" fill="#53616a">OpenAI notifies Hugging Face</text><circle cx="39" cy="551" r="7" fill="#237b79"/><text x="62" y="540" font-size="14" font-weight="750" fill="#237b79">21 JUL</text><text x="62" y="568" font-size="20" font-weight="650" fill="#203341">OpenAI discloses</text><text x="62" y="593" font-size="16" font-weight="400" fill="#53616a">Its public account follows</text></g></svg>